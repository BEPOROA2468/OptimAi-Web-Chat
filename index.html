<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptimAI Local Router Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-2xl bg-gray-800 p-4 rounded-xl shadow-md text-center">
        <h1 class="text-xl font-bold text-green-400">OptimAI Local Router Chat</h1>
        <p class="text-xs text-gray-400 mt-1">Model: Qwen 3 VL4B Instruct</p>
    </header>

    <!-- Chat Box -->
    <main id="chatContainer" class="w-full max-w-2xl flex-1 bg-gray-800 my-4 p-4 rounded-xl overflow-y-auto flex flex-col gap-3 shadow-inner max-h-[65vh]">
        <div class="text-gray-400 text-center text-sm">চ্যাট শুরু করতে নিচে আপনার প্রশ্ন লিখুন...</div>
    </main>

    <!-- Input Area -->
    <footer class="w-full max-w-2xl flex gap-2">
        <input type="text" id="userInput" placeholder="এখানে লিখুন..." class="flex-1 bg-gray-800 p-3 rounded-xl border border-gray-700 focus:outline-none focus:border-green-400" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" class="bg-green-600 hover:bg-green-500 px-6 rounded-xl font-semibold transition">পাঠান</button>
    </footer>

    <script>
        // এখানে আপনার কনফিগারেশন সেট করে দেওয়া হয়েছে
        const API_BASE_URL = "https://api-router.optimai.network/v1"; 
        const API_KEY = "oar_nMjb77ajN2Udwhuf_DsiovLN1MUvqFf0Qy"; // আপনার সঠিক API Key
        const MODEL_NAME = "Qwen 3 VL4B Instruct"; // আপনার মডেলের সঠিক নাম

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // ইউজার মেসেজ চ্যাটে দেখানো
            chatContainer.innerHTML += `<div class="bg-blue-600 p-3 rounded-lg max-w-[80%] self-end"><b>আপনি:</b> ${prompt}</div>`;
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // লোডিং ইন্ডিকেটর
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `<div id="${loadingId}" class="bg-gray-700 p-3 rounded-lg max-w-[80%] self-start text-gray-300">ভেবে দেখছি...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // ইউআরএল ঠিকভাবে জোড়া দেওয়া হয়েছে
                const endpoint = `${API_BASE_URL.replace(/\/+$/, '')}/chat/completions`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [{ role: "user", content: prompt }]
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    chatContainer.innerHTML += `<div class="bg-gray-700 p-3 rounded-lg max-w-[80%] self-start border border-gray-600"><b>AI:</b> ${reply}</div>`;
                } else {
                    chatContainer.innerHTML += `<div class="bg-red-600 p-3 rounded-lg max-w-[80%] self-start">এরর: কোনো রেসপন্স পাওয়া যায়নি।</div>`;
                }
            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                
                chatContainer.innerHTML += `<div class="bg-red-600 p-3 rounded-lg max-w-[80%] self-start">কানেকশন এরর: ${error.message}</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
